[package]
name = "kikyo-login"
version = "0.1.0"
description = "WeChat/QQ OAuth QR-code login demo"
default-run = "TauriLogin"
authors = ["Kikyo"]
edition = "2024"

[[bin]]
name = "TauriLogin"
path = "src/main.rs"

[lib]
name = "kikyo_login_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
